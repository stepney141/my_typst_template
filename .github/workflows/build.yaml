name: Test Typst templates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fonts
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y \
            fonts-inter \
            fonts-ipafont \
            fonts-noto \
            fonts-urw-base35 \
            ttf-mscorefonts-installer \
            unzip \
            wget
          mkdir -p "$RUNNER_TEMP/fonts"
          wget -q \
            "https://github.com/yuru7/udev-gothic/releases/download/v1.3.1/UDEVGothic_v1.3.1.zip" \
            -O "$RUNNER_TEMP/UDEVGothic.zip"
          unzip -q "$RUNNER_TEMP/UDEVGothic.zip" -d "$RUNNER_TEMP/fonts/UDEVGothic"
          wget -q \
            "https://github.com/adobe-fonts/source-han-serif/releases/download/2.002R/12_SourceHanSerifJP.zip" \
            -O "$RUNNER_TEMP/SourceHanSerifJP.zip"
          unzip -q "$RUNNER_TEMP/SourceHanSerifJP.zip" -d "$RUNNER_TEMP/fonts/SourceHanSerifJP"
          fc-cache -f

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Run regression tests
        env:
          TYPST_TEST_FONT_PATH: ${{ runner.temp }}/fonts
        run: ./scripts/test.sh
